name: Windows installer (Tauri)

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "src-tauri/**"
      - "scripts/windows/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - ".github/workflows/windows-tauri.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Next standalone for desktop shell
        run: |
          npm run build
          npm run lumen:standalone

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@2

      - name: Build Windows installer (NSIS)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          tauriScript: npx tauri
          args: --bundles nsis
          includeRelease: true
          includeDebug: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
