# Config mínima para Lumen: JSON API habilitada (necesaria para el cliente).
use_default_settings: true

general:
  instance_name: "Lumen SearXNG"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "es-ES"
  formats:
    - html
    - json

server:
  secret_key: "lumen-local-change-me"
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true
