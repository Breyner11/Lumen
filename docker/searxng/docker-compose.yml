# SearXNG local — metabuscador libre (AGPL-3.0).
# Uso (Linux/macOS/WSL o Docker Desktop en Windows):
#   cd docker/searxng
#   docker compose up -d
# Luego en Lumen → Ajustes → motores → SearXNG en http://127.0.0.1:8080
#
# Guía Windows: docs/searxng-windows.md

services:
  searxng:
    image: searxng/searxng:latest
    container_name: lumen-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
    restart: unless-stopped
